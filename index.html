<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Empire Digital</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --gold:#f6d36b;
  --gold2:#c59635;
  --gold3:#ffe8a0;
  --gold4:#8b641f;

  --black:#030303;
  --bg:#070707;
  --panel:#0d0d0f;
  --panel2:#121214;

  --text:#fff;
  --muted:#9999a0;

  --line:rgba(246,211,107,.20);
  --lineStrong:rgba(246,211,107,.48);
}

html,body{
  margin:0;
  min-height:100%;
  background:#020202;
  color:var(--text);
  font-family:Tahoma,Arial,sans-serif;
}

body{
  overflow-x:hidden;
}

/* ===== BACKGROUND ===== */

body:before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-3;
  background:
    radial-gradient(circle at 50% -10%,rgba(246,211,107,.13),transparent 28%),
    radial-gradient(circle at 100% 35%,rgba(160,110,25,.08),transparent 28%),
    radial-gradient(circle at 0 70%,rgba(246,211,107,.045),transparent 30%),
    linear-gradient(180deg,#0a0907,#020202 75%);
}

body:after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  pointer-events:none;
  opacity:.18;
  background-image:
    radial-gradient(rgba(255,255,255,.08) .6px,transparent .6px);
  background-size:8px 8px;
}

/* ===== APP ===== */

.app{
  width:100%;
  max-width:620px;
  min-height:100vh;
  margin:auto;
  padding-bottom:92px;
  background:
    linear-gradient(
      180deg,
      rgba(8,8,9,.94),
      rgba(2,2,3,.99)
    );
}

/* ===== HEADER ===== */

header{
  position:sticky;
  top:0;
  z-index:50;

  padding:13px 15px 12px;

  background:rgba(5,5,6,.91);
  border-bottom:1px solid var(--line);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  box-shadow:
    0 12px 35px rgba(0,0,0,.55);
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.logo{
  display:flex;
  align-items:center;
  gap:8px;

  font-size:21px;
  font-weight:900;
  letter-spacing:.2px;

  color:var(--gold3);

  text-shadow:
    0 0 18px rgba(246,211,107,.15);
}

.logo-mark{
  width:37px;
  height:37px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:12px;

  border:1px solid var(--lineStrong);

  background:
    radial-gradient(circle at 50% 25%,rgba(246,211,107,.22),transparent 55%),
    linear-gradient(145deg,#211806,#090909);

  box-shadow:
    inset 0 0 18px rgba(246,211,107,.06),
    0 4px 18px rgba(0,0,0,.5);
}

.logo-text span{
  color:#fff;
}

.cart{
  min-width:51px;
  height:40px;

  border:1px solid var(--gold2);
  border-radius:12px;

  background:
    linear-gradient(145deg,#211806,#0b0b0d);

  color:var(--gold3);

  font-size:14px;
  font-weight:bold;

  box-shadow:
    inset 0 0 15px rgba(246,211,107,.05),
    0 4px 14px rgba(0,0,0,.4);
}

.cart:active{
  transform:scale(.95);
}

/* ===== SEARCH ===== */

.search{
  margin-top:12px;
  display:flex;
  gap:8px;
}

.search input{
  flex:1;
  width:100%;

  height:44px;

  padding:0 14px;

  border-radius:13px;
  border:1px solid #303035;

  background:#101012;

  color:#fff;
  outline:none;

  font-size:12px;
}

.search input::placeholder{
  color:#77777e;
}

.search input:focus{
  border-color:var(--gold2);

  box-shadow:
    0 0 0 3px rgba(246,211,107,.06);
}

.search button{
  width:45px;

  border:1px solid var(--gold2);
  border-radius:13px;

  background:
    linear-gradient(145deg,#241b09,#0b0b0d);

  color:var(--gold3);

  font-size:16px;
}

/* ===== PAGES ===== */

.page{
  display:none;
  padding-top:16px;
}

.page.active{
  display:block;
}

section{
  padding:0 15px 19px;
}

/* ===== HERO ===== */

.hero{
  margin:16px 15px 21px;

  padding:25px 19px 20px;

  border-radius:25px;

  position:relative;
  overflow:hidden;

  border:1px solid rgba(246,211,107,.52);

  background:
    radial-gradient(circle at 92% 5%,rgba(246,211,107,.18),transparent 30%),
    radial-gradient(circle at 0 100%,rgba(151,102,24,.12),transparent 35%),
    linear-gradient(145deg,#1a1409,#080809 58%,#100d08);

  box-shadow:
    0 20px 45px rgba(0,0,0,.65),
    inset 0 1px 0 rgba(255,255,255,.07);
}

.hero:before{
  content:"";
  position:absolute;
  inset:6px;

  border:1px solid rgba(246,211,107,.13);
  border-radius:20px;

  pointer-events:none;
}

.hero:after{
  content:"✦";

  position:absolute;
  left:15px;
  top:5px;

  font-size:76px;

  color:rgba(246,211,107,.08);

  transform:rotate(12deg);
}

.hero-content{
  position:relative;
  z-index:2;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;

  padding:6px 11px;

  border-radius:30px;

  background:rgba(246,211,107,.08);
  border:1px solid rgba(246,211,107,.27);

  color:var(--gold3);

  font-size:8px;
  letter-spacing:1.2px;
}

.hero h1{
  margin:13px 0 7px;

  font-size:24px;
  line-height:1.45;

  color:#fff;
}

.hero h1 span{
  color:var(--gold3);
}

.hero p{
  margin:0 0 17px;

  color:#aaa8a2;

  font-size:11px;
  line-height:1.9;
}

.hero-button{
  width:100%;
  height:47px;

  border:1px solid #ffe29a;
  border-radius:13px;

  background:
    linear-gradient(
      110deg,
      #ffeaa9,
      #f1c75b 48%,
      #a96f17
    );

  color:#171105;

  font-size:12px;
  font-weight:900;

  box-shadow:
    0 9px 25px rgba(246,211,107,.13),
    inset 0 1px rgba(255,255,255,.55);
}

/* ===== SECTION HEADER ===== */

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:12px;
}

.section-head h2{
  margin:0;

  font-size:16px;
  font-weight:900;
}

.section-head h2:after{
  content:"";

  display:block;

  width:38px;
  height:2px;

  margin-top:6px;

  border-radius:2px;

  background:
    linear-gradient(
      90deg,
      var(--gold),
      transparent
    );
}

.section-head span{
  color:#77777d;
  font-size:9px;
}

/* ===== CATEGORIES ===== */

.categories{
  display:flex;
  gap:8px;

  overflow-x:auto;

  padding-bottom:6px;

  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category{
  flex-shrink:0;

  display:flex;
  align-items:center;
  gap:5px;

  padding:9px 13px;

  border-radius:20px;

  background:
    linear-gradient(145deg,#131316,#080809);

  border:1px solid #303036;

  color:#96969c;

  font-size:10px;
}
