<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Empire Digital</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --gold:#f6d36b;
  --gold2:#c59635;
  --gold3:#ffe8a0;
  --gold4:#8b641f;
  --black:#030303;
  --bg:#070707;
  --panel:#0d0d0f;
  --panel2:#121214;
  --text:#fff;
  --muted:#9999a0;
  --line:rgba(246,211,107,.20);
  --lineStrong:rgba(246,211,107,.48);
}

html,body{
  margin:0;
  min-height:100%;
  background:#020202;
  color:var(--text);
  font-family:Tahoma,Arial,sans-serif;
}

body{
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-3;
  background:
    radial-gradient(circle at 50% -10%,rgba(246,211,107,.13),transparent 28%),
    radial-gradient(circle at 100% 35%,rgba(160,110,25,.08),transparent 28%),
    radial-gradient(circle at 0 70%,rgba(246,211,107,.045),transparent 30%),
    linear-gradient(180deg,#0a0907,#020202 75%);
}

body:after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  pointer-events:none;
  opacity:.18;
  background-image:
    radial-gradient(rgba(255,255,255,.08) .6px,transparent .6px);
  background-size:8px 8px;
}

.app{
  width:100%;
  max-width:620px;
  min-height:100vh;
  margin:auto;
  padding-bottom:92px;
  background:
    linear-gradient(
      180deg,
      rgba(8,8,9,.94),
      rgba(2,2,3,.99)
    );
}

header{
  position:sticky;
  top:0;
  z-index:50;
  padding:13px 15px 12px;
  background:rgba(5,5,6,.91);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:0 12px 35px rgba(0,0,0,.55);
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.logo{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:21px;
  font-weight:900;
  letter-spacing:.2px;
  color:var(--gold3);
  text-shadow:0 0 18px rgba(246,211,107,.15);
}

.logo-mark{
  width:37px;
  height:37px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  border:1px solid var(--lineStrong);
  background:
    radial-gradient(circle at 50% 25%,rgba(246,211,107,.22),transparent 55%),
    linear-gradient(145deg,#211806,#090909);
  box-shadow:
    inset 0 0 18px rgba(246,211,107,.06),
    0 4px 18px rgba(0,0,0,.5);
}

.logo-text span{
  color:#fff;
}

.cart{
  min-width:51px;
  height:40px;
  border:1px solid var(--gold2);
  border-radius:12px;
  background:linear-gradient(145deg,#211806,#0b0b0d);
  color:var(--gold3);
  font-size:14px;
  font-weight:bold;
  box-shadow:
    inset 0 0 15px rgba(246,211,107,.05),
    0 4px 14px rgba(0,0,0,.4);
}

.cart:active{
  transform:scale(.95);
}

.search{
  margin-top:12px;
  display:flex;
  gap:8px;
}

.search input{
  flex:1;
  width:100%;
  height:44px;
  padding:0 14px;
  border-radius:13px;
  border:1px solid #303035;
  background:#101012;
  color:#fff;
  outline:none;
  font-size:12px;
}

.search input::placeholder{
  color:#77777e;
}

.search input:focus{
  border-color:var(--gold2);
  box-shadow:0 0 0 3px rgba(246,211,107,.06);
}

.search button{
  width:45px;
  border:1px solid var(--gold2);
  border-radius:13px;
  background:linear-gradient(145deg,#241b09,#0b0b0d);
  color:var(--gold3);
  font-size:16px;
}

.page{
  display:none;
  padding-top:16px;
}

.page.active{
  display:block;
}

section{
  padding:0 15px 19px;
}

.hero{
  margin:16px 15px 21px;
  padding:25px 19px 20px;
  border-radius:25px;
  position:relative;
  overflow:hidden;
  border:1px solid rgba(246,211,107,.52);
  background:
    radial-gradient(circle at 92% 5%,rgba(246,211,107,.18),transparent 30%),
    radial-gradient(circle at 0 100%,rgba(151,102,24,.12),transparent 35%),
    linear-gradient(145deg,#1a1409,#080809 58%,#100d08);
  box-shadow:
    0 20px 45px rgba(0,0,0,.65),
    inset 0 1px 0 rgba(255,255,255,.07);
}

.hero:before{
  content:"";
  position:absolute;
  inset:6px;
  border:1px solid rgba(246,211,107,.13);
  border-radius:20px;
  pointer-events:none;
}

.hero:after{
  content:"✦";
  position:absolute;
  left:15px;
  top:5px;
  font-size:76px;
  color:rgba(246,211,107,.08);
  transform:rotate(12deg);
}

.hero-content{
  position:relative;
  z-index:2;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:6px 11px;
  border-radius:30px;
  background:rgba(246,211,107,.08);
  border:1px solid rgba(246,211,107,.27);
  color:var(--gold3);
  font-size:8px;
  letter-spacing:1.2px;
}

.hero h1{
  margin:13px 0 7px;
  font-size:24px;
  line-height:1.45;
  color:#fff;
}

.hero h1 span{
  color:var(--gold3);
}

.hero p{
  margin:0 0 17px;
  color:#aaa8a2;
  font-size:11px;
  line-height:1.9;
}

.hero-button{
  width:100%;
  height:47px;
  border:1px solid #ffe29a;
  border-radius:13px;
  background:
    linear-gradient(
      110deg,
      #ffeaa9,
      #f1c75b 48%,
      #a96f17
    );
  color:#171105;
  font-size:12px;
  font-weight:900;
  box-shadow:
    0 9px 25px rgba(246,211,107,.13),
    inset 0 1px rgba(255,255,255,.55);
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.section-head h2{
  margin:0;
  font-size:16px;
  font-weight:900;
}

.section-head h2:after{
  content:"";
  display:block;
  width:38px;
  height:2px;
  margin-top:6px;
  border-radius:2px;
  background:linear-gradient(90deg,var(--gold),transparent);
}

.section-head span{
  color:#77777d;
  font-size:9px;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:6px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category{
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:5px;
  padding:9px 13px;
  border-radius:20px;
  background:linear-gradient(145deg,#131316,#080809);
  border:1px solid #303036;
  color:#96969c;
  font-size:10px;
}

.category.active{
  color:var(--gold3);
  border-color:#b98327;
  background:linear-gradient(135deg,#38290d,#120e07);
  box-shadow:
    0 0 18px rgba(246,211,107,.07),
    inset 0 0 12px rgba(246,211,107,.035);
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.product{
  position:relative;
  overflow:hidden;
  padding:7px;
  border-radius:19px;
  border:1px solid rgba(246,211,107,.30);
  background:linear-gradient(155deg,#151515,#080809);
  box-shadow:
    0 14px 30px rgba(0,0,0,.48),
    inset 0 0 0 1px rgba(255,255,255,.025);
  transition:
    transform .18s ease,
    border-color .18s ease;
}

.product:active{
  transform:scale(.975);
  border-color:rgba(246,211,107,.62);
}

.product:before{
  content:"";
  position:absolute;
  inset:4px;
  border:1px solid rgba(246,211,107,.09);
  border-radius:15px;
  pointer-events:none;
}

.product:after{
  content:"";
  position:absolute;
  top:0;
  right:18px;
  width:40px;
  height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  box-shadow:0 0 10px rgba(246,211,107,.28);
}

.product-img{
  height:126px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:14px;
  overflow:hidden;
  border:1px solid rgba(246,211,107,.48);
  background:
    radial-gradient(circle at 50% 35%,rgba(246,211,107,.18),transparent 38%),
    linear-gradient(145deg,#201807,#09090a);
  box-shadow:
    inset 0 0 0 4px rgba(246,211,107,.035),
    inset 0 0 35px rgba(246,211,107,.06);
}

.product-img:before{
  content:"";
  position:absolute;
  inset:5px;
  border:1px solid rgba(255,226,145,.18);
  border-radius:10px;
}

.product-img:after{
  content:"";
  position:absolute;
  width:65px;
  height:65px;
  border-radius:50%;
  border:1px solid rgba(246,211,107,.10);
  box-shadow:0 0 35px rgba(246,211,107,.06);
}

.product-art{
  position:relative;
  z-index:2;
  width:62px;
  height:62px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:18px;
  background:linear-gradient(145deg,#33240c,#0d0c09);
  border:1px solid rgba(246,211,107,.38);
  font-size:31px;
  box-shadow:
    0 10px 22px rgba(0,0,0,.65),
    inset 0 0 18px rgba(246,211,107,.06);
}

.product h3{
  margin:10px 3px 4px;
  min-height:32px;
  color:#fff;
  font-size:11px;
  line-height:1.5;
}

.product p{
  height:34px;
  margin:0 3px 8px;
  color:#85858c;
  font-size:9px;
  line-height:1.55;
}

.product-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:5px;
  padding:0 2px 2px;
}

.price{
  color:var(--gold3);
  font-size:13px;
  font-weight:900;
  text-shadow:0 0 10px rgba(246,211,107,.13);
}

.buy{
  padding:7px 9px;
  border-radius:9px;
  border:1px solid #b27e26;
  background:linear-gradient(145deg,#29200d,#0f0d09);
  color:var(--gold3);
  font-size:9px;
  font-weight:bold;
}

/* ===== DETAIL ===== */

.back{
  margin-bottom:12px;
  padding:9px 13px;
  border-radius:11px;
  border:1px solid #4b3b1b;
  background:linear-gradient(145deg,#1a150a,#0d0d0e);
  color:#ddd;
  font-size:11px;
}

.detail-card,
.account-card{
  position:relative;
  padding:11px;
  border-radius:22px;
  border:1px solid rgba(246,211,107,.42);
  background:linear-gradient(155deg,#15130e,#080809);
  box-shadow:
    0 18px 40px rgba(0,0,0,.55),
    inset 0 0 0 1px rgba(246,211,107,.06);
}

.detail-card:before,
.account-card:before{
  content:"";
  position:absolute;
  inset:6px;
  border:1px solid rgba(246,211,107,.10);
  border-radius:17px;
  pointer-events:none;
}

.detail-img{
  height:205px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:16px;
  font-size:76px;
  border:1px solid rgba(246,211,107,.55);
  background:
    radial-gradient(circle,rgba(246,211,107,.18),transparent 43%),
    linear-gradient(145deg,#211807,#09090a);
  box-shadow:
    inset 0 0 0 4px rgba(246,211,107,.035),
    inset 0 0 35px rgba(246,211,107,.07);
}

.detail-card h1{
  margin:15px 3px 7px;
  color:var(--gold3);
  font-size:20px;
}

.detail-text{
  color:#aaa8a3;
  font-size:11px;
  line-height:1.9;
}

/* NEW CONTENT BOX */

.detail-section-title{
  margin:18px 3px 9px;
  color:var(--gold3);
  font-size:13px;
  font-weight:900;
}

.features{
  margin:0;
  padding:13px;
  border-radius:13px;
  background:#0b0b0d;
  border:1px solid rgba(246,211,107,.16);
  color:#d0cdc5;
  font-size:10px;
  line-height:2.05;
}
